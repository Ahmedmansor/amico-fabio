name: Astro production Pages

on:
  push:
    branches: [main, try-to-refactoring-to-astro]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astro-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astro-site
    env:
      CATALOG_PROVIDER: supabase
      CATALOG_SUPABASE_URL: https://iiivnvwspoikfrlclhyr.supabase.co
      CATALOG_SUPABASE_PUBLISHABLE_KEY: ${{ fromJSON(vars.ASTRO_PUBLIC_BUILD_CONFIG).catalogKey }}
      PUBLIC_AUTH_SUPABASE_PUBLISHABLE_KEY: ${{ fromJSON(vars.ASTRO_PUBLIC_BUILD_CONFIG).authKey }}
      PUBLIC_AUTH_TURNSTILE_SITE_KEY: ${{ fromJSON(vars.ASTRO_PUBLIC_BUILD_CONFIG).turnstileSiteKey }}
      PUBLIC_AUTH_SUPABASE_URL: https://iiivnvwspoikfrlclhyr.supabase.co
      PUBLIC_SITE_URL: https://fabioegypt.com
      PUBLIC_AUTH_SITE_URL: https://fabioegypt.com
      PUBLIC_NOINDEX: ''
      BLOG_INCLUDE_FIXTURES: '0'
      PUBLIC_AUTH_ENABLED: '1'
      PUBLIC_AUTH_GOOGLE_ENABLED: '1'
      PUBLIC_AUTH_EMAIL_ENABLED: '1'
      PUBLIC_AUTH_PASSWORD_ENABLED: '1'
      PUBLIC_AUTH_RESEND_SECONDS: '60'
      PUBLIC_WISHLIST_ACCOUNT_SYNC_ENABLED: '1'
      PUBLIC_ACCOUNT_LOCALE_ENABLED: '1'
      PUBLIC_ACCOUNT_ONBOARDING_ENABLED: '1'
      PUBLIC_MARKETING_CONSENT_ENABLED: '1'
      PUBLIC_WISHLIST_REMINDER_OPT_IN_ENABLED: '1'
      PUBLIC_WISHLIST_EMAIL_MANAGEMENT_ENABLED: '1'
      PUBLIC_WISHLIST_EMAIL_TEST_ENABLED: '0'
      PUBLIC_WISHLIST_EMAIL_TEST_ENDPOINT: ''
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: astro-site/.nvmrc
          cache: npm
          cache-dependency-path: astro-site/package-lock.json
      - run: npm ci
      - run: npx astro check
      - run: npm run build
      - run: node scripts/verify-production.mjs
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: astro-site/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy verified static artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
