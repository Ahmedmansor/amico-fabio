<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><meta name="robots" content="noindex, follow"><meta http-equiv="refresh" content="0;url=/it/login/"><title>Accedi a Fabio Egypt</title></head><body><a href="/it/login/">Accedi</a><script>
// Alias keeps only an explicit return-path input; the login page validates it.
const destination=new URL('/it/login/',location.origin);

location.replace(destination.href);
</script></body></html>
